name: SonarQube Analysis

on:
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  sonar-backend:
    name: Backend Analysis
    uses: IFPBEsp/APAE-INFRA/.github/workflows/reusable-sonarqube-maven.yml@dev
    with:
      project-key: "apae-gestao-escolar-backend"
      organization: "ifpbesp"
      working-directory: "api"
      java-version: "21"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-frontend:
    name: Frontend Analysis
    uses: IFPBEsp/APAE-INFRA/.github/workflows/reusable-sonarqube-node.yml@dev
    with:
      project-key: "apae-gestao-escolar-frontend"
      organization: "ifpbesp"
      working-directory: "app"
      node-version: "22"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
